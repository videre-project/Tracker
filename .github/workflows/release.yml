name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Version from package.json to publish
        required: true
        type: string
      run_id:
        description: CI workflow run that uploaded the publish artifact
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (defaults to package.json)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: tracker-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Tracker ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          expected="$(node -p "require('./package.json').version")"
          if [ -z "$version" ] || [ "$version" != "$expected" ]; then
            echo "Release version must match package.json ($expected)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if the GitHub release already exists
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CI run
        if: steps.existing.outputs.exists != 'true'
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(gh run list \
            --workflow ci.yml \
            --commit "${{ github.sha }}" \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful CI run found for ${{ github.sha }}." >&2
            gh run list --workflow ci.yml --commit "${{ github.sha }}" --limit 5
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download CI publish artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: tracker-publish-${{ github.sha }}
          path: publish
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}

      - name: Download CI plugin API package
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: tracker-plugin-api-${{ github.sha }}
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}

      - name: Verify plugin API package identity and version
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/ci/verify-plugin-package.py

      - name: Setup .NET
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check NuGet publishing configuration
        if: steps.existing.outputs.exists != 'true'
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Set the NUGET_USER secret to your NuGet.org profile username in the Tracker repository or release environment." >&2
            exit 1
          fi

      - name: NuGet login
        if: steps.existing.outputs.exists != 'true'
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish plugin API to NuGet
        if: steps.existing.outputs.exists != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          package=(packages/*.nupkg)
          status="$(curl --silent --show-error --http1.1 \
            --request PUT \
            --header "X-NuGet-ApiKey: $NUGET_API_KEY" \
            --header "X-NuGet-Protocol-Version: 4.1.0" \
            --header "Transfer-Encoding: chunked" \
            --user-agent "VidereTrackerRelease" \
            --form "package=@${package[0]};type=application/octet-stream" \
            --output nuget-response.txt \
            --write-out '%{http_code}' \
            https://www.nuget.org/api/v2/package/)"
          echo "NuGet HTTP status: $status"
          cat nuget-response.txt
          case "$status" in
            201|202|409) ;;
            *) exit 1 ;;
          esac

      - name: Verify published plugin API matches the CI artifact
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/ci/verify-plugin-package.py --published

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="publish/Videre Tracker.exe"
          if [ ! -f "$exe" ]; then
            echo "Published executable was not found: $exe" >&2
            find publish -maxdepth 2 -type f -print
            exit 1
          fi
          gh release create "${{ steps.version.outputs.tag }}" "$exe#Videre Tracker.exe" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
