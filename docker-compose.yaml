services:
  tracker-dev:
    build:
      context: .
      dockerfile: docker/tracker-dev.Dockerfile
    image: videreproject/tracker:wayland-dev
    init: true
    stdin_open: true
    tty: true
    ipc: host
    tmpfs:
      - /tmp/runtime-dir:uid=1000,gid=1000,mode=0700
    environment:
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /tmp/runtime-dir
      WINEDEBUG: -all
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      GDK_BACKEND: x11
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      GALLIUM_DRIVER: llvmpipe
      TRACKER_DISABLE_INSTALLER: "1"
      TRACKER_WINE_COMPAT: "1"
      TRACKER_SKIP_MTGO: ${TRACKER_SKIP_MTGO:-0}
      APP_THEME: Dark
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
      Updates__FeedUrl: ${TRACKER_UPDATE_FEED_URL:-}
      ASPNETCORE_ENVIRONMENT: Development
      DEV_SERVER_HTTP: "1"
      # Vite is started inside this container.
      # Override these to use a host `pnpm dev:client` instead
      # (e.g. http://host.docker.internal:5279).
      SPA_PROXY_SERVER_URL: ${TRACKER_UI_URL:-http://127.0.0.1:5279}
      TRACKER_UI_URL: ${TRACKER_UI_URL:-http://127.0.0.1:5279}
    volumes:
      - .:/workspace
      - ../platform:/platform
      - tracker-wine-data:/home/wine/.wine
      - ${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR must be set}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/runtime-dir/${WAYLAND_DISPLAY:-wayland-0}
      - /tmp/.X11-unix:/tmp/.X11-unix
    command:
      - /bin/bash
      - /workspace/docker/run-tracker-dev.sh
    ports:
      # .NET API (HTTPS) is exposed to the host for debugging purposes.
      - "127.0.0.1:7101:7101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  tracker-wine-data:
